---
- name: Configure Jenkins Worker
  hosts: jenkins_worker
  become: yes
  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - openjdk-17-jre
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - git
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Create Jenkins user
      ansible.builtin.user:
        name: jenkins
        shell: /bin/bash
        create_home: yes

    - name: Add Jenkins user to Docker group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: yes
      notify: Restart Docker

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
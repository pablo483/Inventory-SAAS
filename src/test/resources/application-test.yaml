spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  
  # Disable Redis for tests by using a dummy host/port
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: "test_secret_key_that_is_at_least_256_bits_long_for_hs256_testing_purposes_only"
    expiration: 86400000

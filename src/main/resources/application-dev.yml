spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:inventory-saas}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:Sudarshan}
    password: ${DB_PASSWORD:letmein}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50    # increased from 10 — prevents pool exhaustion under load
      minimum-idle: 10         # increased from 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # Flyway is OFF in dev on purpose: Hibernate's ddl-auto:update above keeps
  # auto-creating/updating your local tables exactly as before. Flyway migrations
  # only run in prod (see application-prod.yml), so local IntelliJ testing is unaffected.
  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0  #use specif room of redist among 16 database
      timeout: 60000ms   #app wait for 1 min to app to start
      jedis:
        pool:
          max-active: 8  #maximum active pools always
          max-idle: 8    #maximum active when now request is coming
          min-idle: 2    #minimum when no request is coming
          max-wait: -1ms   #wait forever for response

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: on_param

logging:
  level:
    root: INFO
    com.inventorysaas.inventory_saas: DEBUG
    org.springframework.web: DEBUG


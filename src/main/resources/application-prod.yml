# Production Profile
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=true&enabledTLSProtocols=TLSv1.2,TLSv1.3&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      leak-detection-threshold: 60000
      connection-timeout: 30000 # 30s — time to wait for a free connection
      idle-timeout: 600000 # 10min — how long an idle connection stays in pool
      max-lifetime: 1800000 # 30min — max connection age before forced recycling

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # Flyway runs the migrations in src/main/resources/db/migration on startup
  # and creates/updates the schema. ddl-auto:validate above then just double-checks
  # the entities match what Flyway created — it never creates tables itself in prod.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  #Redis config
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 60000ms
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      jedis:
        pool:
          max-active: 20
          max_idle: 10
          min-idle: 2
          max-wait: 2000ms

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true # Shrinks the data (GZIP) before sending it to the browser/clien(makes api with  large json request  faster)
  http2:
    enabled: true #Upgrades the connection to the modern HTTP/2 protocol(Allows the server to send multiple files/responses over a single connection simultaneously, reducing "lag.")

# Production logging (less verbose)
logging:
  level:
    root: WARN
    com.inventorysaas.inventory_saas: INFO
  file:
    name: /var/log/app/application.log #it saves all logs to this specific file on the server.
    max-size: 10MB #When the log file hits 10MB, the app stops writing to it and starts a new one (Rotation).
    max-history: 30 #The app will keep the last 30 log files. On the 31st day, it deletes the oldest one.

# Add to production config
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator

  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

  metrics:
    export:
      prometheus:
        enabled: true #Activates Spring Boot's internal Micrometer engine to convert Java runtime metrics into the exact format Prometheus understands.
    tags:
      application: ${spring.application.name}
      environment: prod #Attaches metadata labels (application="saasproject", environment="prod") to every single metric.

# ============================================================
# nginx.conf — reverse proxy + load balancer for inventory-saas
#
# Sits in front of app1/app2/app3 (the three Spring Boot containers).
# least_conn = send the next request to whichever backend currently has
# the fewest active connections (better than plain round-robin under
# uneven load, e.g. one request that's slow to finish).
#
# ⚠️  BEFORE DEPLOYING: replace YOUR_DOMAIN below with your real domain
#     e.g.  server_name api.acmecorp.com;
# ============================================================

upstream inventory_backend {
    least_conn;
    server app1:8080;
    server app2:8080;
    server app3:8080;
}

# Plain HTTP: redirect everything to HTTPS
server {
    listen 80;
    server_name localhost;   # ← replaced with localhost for testing
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name localhost;   # ← replaced with localhost for testing

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Reasonable modern defaults; not exhaustive hardening, just a sane baseline
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # HSTS — tells browsers to always use HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compression (Spring's own gzip is also on, this covers static/proxy responses too)
    gzip on;
    gzip_types application/json text/plain;

    location /api/ {
        proxy_pass http://inventory_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator health check, routed the same way so you can curl it externally if needed
    location /actuator/health {
        proxy_pass http://inventory_backend;
        proxy_set_header Host $host;
    }
}
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: inventory-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - inventory-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=500
      - --innodb_buffer_pool_size=2G
      - --innodb_log_file_size=512M
      - --innodb_flush_log_at_trx_commit=2
      - --slow_query_log=1
      - --slow_query_log_file=/var/log/mysql/slow-query.log
      - --long_query_time=2
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: inventory-redis-prod
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - inventory-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ============================================================
  # APP INSTANCES — three explicit copies instead of `deploy.replicas`.
  #
  # Why explicit copies instead of replicas: plain `docker-compose up`
  # (no Swarm) can't run multiple containers under one fixed container_name,
  # and Nginx needs stable, known hostnames to route to (app1/app2/app3 below)
  # rather than relying on Docker Swarm's virtual-IP DNS round-robin, which
  # plain Compose doesn't provide. This is simpler to reason about while learning.
  #
  # None of these publish a host port — only Nginx is reachable from outside.
  # Requests flow: client -> nginx (80/443) -> app1 or app2 or app3 (8080, internal only)
  # ============================================================

  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-app-prod-1
    restart: always
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod   # was SPRING_PROFILE, which Spring never reads — silently ran as dev before
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - inventory-network
    volumes:
      - app_logs:/var/log/inventory-saas
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-app-prod-2
    restart: always
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - inventory-network
    volumes:
      - app_logs:/var/log/inventory-saas
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  app3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-app-prod-3
    restart: always
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - inventory-network
    volumes:
      - app_logs:/var/log/inventory-saas
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ============================================================
  # NGINX — the single public entry point. Terminates SSL, load-balances
  # across app1/app2/app3, and is the only service that publishes host ports.
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: inventory-nginx-prod
    restart: always
    depends_on:
      - app1
      - app2
      - app3
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - inventory-network

networks:
  inventory-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  app_logs: